{% extends "orageApp/base.html" %}
{% load static %}

{% block title %}Carte en direct - Surveillance des Orages{% endblock %}

{% block extra_head %}

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}

{% block content %}

</main>
{% endblock %}
{% block extra_js %}

{% endblock %}
