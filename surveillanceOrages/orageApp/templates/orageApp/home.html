{% extends 'orageApp/base.html' %}

{% block title %}Accueil - Surveillance des Orages{% endblock %}

{% block content %}
<main class="flex-grow-1 d-flex align-items-center justify-content-center p-4">
    <div class="card bg-body-tertiary border-secondary-subtle shadow-lg p-3 text-center" style="max-width: 540px;">
        <div class="card-body">
            <div class="display-3 mb-3">⚡</div>
            <h2 class="card-title fw-bold text-light mb-3">Surveillance Locale des Orages</h2>
            <p class="card-text text-body-secondary mb-4" style="line-height: 1.6;">
            <h6 class="card-subtitle text-uppercase text-body-secondary small fw-bold mb-2">Blablabla</h6>
            </p>
            <a href="{% url 'carte' %}" class="btn btn-primary px-4 py-2 d-inline-flex align-items-center gap-2">
                <i class="bi bi-map"></i> Accéder à la carte
            </a>
        </div>
    </div>
</main>
{% endblock %}

{% block sidebar_right %}
    <div class="pb-3 mb-3 border-bottom border-secondary-subtle">
        <h6 class="mb-1 fw-bold text-light">Blablabla</h6>
        <small class="text-secondary">Blablabla</small>
    </div>

    <div class="card bg-body-tertiary border-secondary-subtle shadow-sm">
        <div class="card-body p-3">
            <h6 class="card-subtitle text-uppercase text-body-secondary small fw-bold mb-2">Blablabla</h6>
        </div>
    </div>
{% endblock %}
